; GRUT firmware - firmware/grut-node
;
; env:esp8285          - BIOS-only firmware (diagnostics/console), used
;                        for all the BIOS/Transport-lifecycle testing
;                        done so far. Excludes bridge_main.cpp.
; env:esp8285-air       - Bridge firmware for the AIR node. No BIOS, no
;                        console - just UART <-> ESP-NOW (ADR 0005).
; env:esp8285-ground    - Same, for the GROUND node.
; env:native            - Host-side unit tests (pio test -e native).
;
; NOTE: platform/board/framework/board_build.* are duplicated across
; the three esp8285* environments rather than factored into a shared
; [env] base. A shared [env] section is inherited by ALL environments
; including env:native, and an empty override (board=, framework=) to
; opt native out of it fails with "BoardConfig: Board is not defined"
; rather than cleanly unsetting the value - duplication here is the
; safer, working tradeoff.

[platformio]
; Plain `pio run` builds the BIOS-only firmware. The bridge envs and
; native (test-only) must be invoked explicitly via -e.
default_envs = esp8285

[env:esp8285]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino

monitor_speed = 57600
upload_speed = 460800

board_build.flash_mode = dout
board_build.f_flash = 40000000L
; 1 MB flash layout: 64 KB reserved for SPIFFS/LittleFS (unused so far,
; kept for future BIOS config/log storage without re-partitioning).
board_build.ldscript = eagle.flash.1m64.ld

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D GRUT_BIOS_VERSION=\"0.1.0\"
    -Iinclude
    -Iconfig

build_src_filter =
    +<*>
    -<bridge_main.cpp>

[env:esp8285-air]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino

monitor_speed = 57600
upload_speed = 460800

board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.1m64.ld

build_src_filter =
    +<bridge_main.cpp>
    +<transport/**>
    -<main.cpp>
    -<bios/**>

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -Iinclude
    -Iconfig
    -D GRUT_BRIDGE_ROLE_AIR
    -D GRUT_NODE_ID=1

[env:esp8285-ground]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino

monitor_speed = 57600
upload_speed = 460800

board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.1m64.ld

build_src_filter =
    +<bridge_main.cpp>
    +<transport/**>
    -<main.cpp>
    -<bios/**>

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -Iinclude
    -Iconfig
    -D GRUT_BRIDGE_ROLE_GROUND
    -D GRUT_NODE_ID=2

; Host-side tests for logic that has no Arduino/ESP8266 dependency
; (lib/bios_command_parser, lib/runtime_manager, lib/grut_protocol,
; lib/frame_queue). Does not touch or affect the esp8285* envs above.
[env:native]
platform = native
test_framework = unity
; src/ (BIOS, transport drivers) depends on Arduino/ESP8266 headers and
; cannot compile on a host toolchain. Only the Arduino-independent
; lib/* packages (pulled in via each test's own #include chain) and
; test/ are built here.
test_build_src = no
build_flags =
    -std=gnu++17
    -Iinclude