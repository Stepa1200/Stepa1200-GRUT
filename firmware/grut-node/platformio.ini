; GRUT BIOS v0.1 - firmware/grut-node
; Target: ESP8285, 1 MB flash, DOUT mode.

[platformio]
; Plain `pio run` builds firmware only. `native` is test-only and must be
; invoked explicitly via `pio test -e native` (see env:native below) - it
; has no Arduino framework and cannot build src/ as a firmware target.
default_envs = esp8285

[env:esp8285]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino

monitor_speed = 57600
upload_speed = 460800

board_build.flash_mode = dout
board_build.f_flash = 40000000L
; 1 MB flash layout: 64 KB reserved for SPIFFS/LittleFS (unused by BIOS v0.1,
; kept for the future BIOS config/log storage without re-partitioning later).
board_build.ldscript = eagle.flash.1m64.ld

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D GRUT_BIOS_VERSION=\"0.1.0\"
    -Iinclude

; Per-node environments (ADR 0006): supply GRUT_NODE_ROLE and
; GRUT_PEER_MAC at build time instead of runtime pairing. Nothing in
; src/ reads these yet (BIOS is frozen, EspNowDriver takes its config
; via constructor args, not these macros) - this is prep infrastructure
; for the milestone that actually wires EspNowDriver into a node-
; specific entry point. Peer MACs below are the two boards already
; flashed and verified earlier in this project (ground: ...C5:59,
; air: ...C5:58) - update if pairing different hardware.
[env:esp8285-air]
extends = env:esp8285
build_flags =
    ${env:esp8285.build_flags}
    -D GRUT_NODE_ROLE=1
    -D GRUT_PEER_MAC={0xEC,0x94,0xCB,0xB4,0xC5,0x59}

[env:esp8285-ground]
extends = env:esp8285
build_flags =
    ${env:esp8285.build_flags}
    -D GRUT_NODE_ROLE=2
    -D GRUT_PEER_MAC={0xEC,0x94,0xCB,0xB4,0xC5,0x58}

; Host-side tests for BIOS logic that has no Arduino/ESP8266 dependency
; (see lib/bios_command_parser and test/test_command_parser). This does
; not touch or affect the esp8285 firmware build above.
[env:native]
platform = native
test_framework = unity
; src/ (main.cpp, Bios.cpp, Diagnostics.cpp, StubTransport.cpp) depends on
; Arduino/ESP8266 headers and cannot compile on a host toolchain. Only
; lib/bios_command_parser (no Arduino dependency) and test/ are built here.
test_build_src = no
build_flags =
    -std=gnu++17
    -Iinclude
